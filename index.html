<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Python Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d16;
    --surface: #111827;
    --surface-elevated: #1f2937;
    --border: #374151;
    --text: #f9fafb;
    --text-muted: #9ca3af;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-glow: rgba(99, 102, 241, 0.25);
    --success: #10b981;
    --success-hover: #059669;
    --danger: #f43f5e;
    --radius-lg: 16px;
    --radius-md: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg);
    background-image: radial-gradient(at 0% 0%, rgba(99,99,241,.12) 0, transparent 50%),
      radial-gradient(at 100% 100%, rgba(16,185,129,.08) 0, transparent 50%);
    background-attachment: fixed; color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh;
    display: flex; justify-content: center; padding: 32px 16px 64px;
  }
  .wrap { width:100%; max-width:900px; display:flex; flex-direction:column; gap:16px; }
  header,.controls-bar,#saveRow,.editor-container,.terminal-container {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; box-shadow:0 10px 30px -10px rgba(0,0,0,.5); }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand-icon { width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 12px rgba(99,102,241,.4); }
  h1 { font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em;background:linear-gradient(to right,#fff,#9ca3af);-webkit-background-clip:text;-webkit-text-fill-color:transparent; }
  .badge { display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);background:var(--surface-elevated);padding:4px 10px;border-radius:20px;border:1px solid var(--border); }
  .status-dot { width:8px;height:8px;border-radius:50%;background:var(--text-muted); }
  .status-dot.active { background:var(--success);box-shadow:0 0 8px var(--success); }
  .status-dot.error { background:var(--danger);box-shadow:0 0 8px var(--danger); }
  .controls-bar { display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px; }
  .file-actions,.editor-actions { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
  button,select,input { font-family:inherit;font-size:13px;font-weight:500;background:var(--surface-elevated);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 14px;outline:none;transition:.2s; }
  button { cursor:pointer;display:inline-flex;align-items:center;gap:6px; }
  button:hover:not(:disabled) { border-color:#4b5563;background:#283344; }
  button:disabled { opacity:.4;cursor:not-allowed; }
  button.primary { background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 10px var(--accent-glow); }
  button.primary:hover:not(:disabled) { background:var(--accent-hover); }
  button.success { background:var(--success);border-color:var(--success);color:#fff; }
  button.success:hover:not(:disabled) { background:var(--success-hover); }
  button.danger-btn { background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.3);color:var(--danger); }
  button.danger-btn:hover:not(:disabled) { background:var(--danger);color:#fff; }
  select { cursor:pointer;max-width:200px; }
  select:focus,input:focus,textarea:focus { border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow); }
  .workspace { display:flex;flex-direction:column;gap:16px; }
  .editor-container,.terminal-container { overflow:hidden;box-shadow:0 8px 24px -6px rgba(0,0,0,.4); }
  .editor-header,.terminal-header { display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-muted); }
  textarea { width:100%;min-height:280px;font-family:'Fira Code',monospace;font-size:14px;line-height:1.6;padding:16px;border:none;background:transparent;color:#e5e7eb;resize:vertical;outline:none; }
  #saveRow { display:none;gap:8px;padding:12px 16px;align-items:center;animation:fadeIn .2s ease; }
  #saveName { flex:1; }
  .terminal-header { font-weight:600;text-transform:uppercase;letter-spacing:.05em; }
  pre#output { margin:0;min-height:130px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;padding:16px;color:#a7f3d0; }
  .err,#diag { color:var(--danger); }
  footer { text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px; }
  #diag { font-size:12px;white-space:pre-wrap; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)} }
  @media (max-width:600px) {
    body { padding:16px 10px 40px; }
    header { padding:14px 16px; }
    .controls-bar { align-items:stretch; }
    .file-actions,.editor-actions { width:100%; }
    button,select { flex:1; }
    .badge { display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="brand-icon">Py</div><h1>Python Studio</h1></div>
    <div class="badge"><span class="status-dot" id="statusDot"></span><span id="status">Loading runtime…</span></div>
  </header>

  <div class="controls-bar">
    <div class="file-actions">
      <button id="newBtn">+ New File</button>
      <select id="loadSelect"><option value="">Open Saved File…</option></select>
      <button id="deleteBtn" class="danger-btn" disabled>Delete</button>
    </div>
    <div class="editor-actions">
      <button id="saveBtn" class="success" disabled>Save File</button>
      <button id="runBtn" class="primary" disabled>Run Code</button>
    </div>
  </div>

  <div id="saveRow">
    <input id="saveName" type="text" placeholder="Enter file name (e.g. main)" />
    <button id="confirmSaveBtn" class="success">Confirm Save</button>
    <button id="cancelSaveBtn">Cancel</button>
  </div>

  <div class="workspace">
    <div class="editor-container">
      <div class="editor-header">
        <span id="currentFileName">Untitled (Unsaved Draft)</span>
        <span>Python 3.11 (Pyodide)</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="Write your Python code here...">print("Hello, welcome to Python Studio!")
for i in range(5):
    print(f"Index: {i}")</textarea>
    </div>

    <div class="terminal-container">
      <div class="terminal-header">
        <span>Console Output</span>
        <button id="clearBtn" style="padding:2px 8px;font-size:11px;">Clear Terminal</button>
      </div>
      <pre id="output"></pre>
    </div>
  </div>

  <div id="diag"></div>
  <footer>Browser-native Python execution. Autosaves draft state locally in real time.</footer>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"
onerror="document.getElementById('diag').textContent='Could not load Pyodide runtime. Check your internet connection or script blockers.'"></script>
<script>
(function () {
  const statusEl=document.getElementById('status'), statusDot=document.getElementById('statusDot');
  const runBtn=document.getElementById('runBtn'), saveBtn=document.getElementById('saveBtn');
  const newBtn=document.getElementById('newBtn'), deleteBtn=document.getElementById('deleteBtn');
  const clearBtn=document.getElementById('clearBtn'), codeEl=document.getElementById('code');
  const outputEl=document.getElementById('output'), loadSelect=document.getElementById('loadSelect');
  const saveRow=document.getElementById('saveRow'), saveName=document.getElementById('saveName');
  const confirmSaveBtn=document.getElementById('confirmSaveBtn'), cancelSaveBtn=document.getElementById('cancelSaveBtn');
  const currentFileNameEl=document.getElementById('currentFileName'), diagEl=document.getElementById('diag');

  const STORAGE_PREFIX='py_studio_file:', DRAFT_KEY='py_studio_current_draft', LAST_ACTIVE_FILE_KEY='py_studio_active_file';
  let pyodide=null, activeFileKey=null;

  function appendOutput(text,isError){
    const span=document.createElement('span');
    if(isError) span.className='err';
    span.textContent=text;
    outputEl.appendChild(span);
    outputEl.scrollTop=outputEl.scrollHeight;
  }

  async function boot(){
    if(typeof loadPyodide==='undefined'){
      statusEl.textContent='Failed to load'; statusDot.className='status-dot error';
      diagEl.textContent='Pyodide CDN failed to load. Please verify your connection.';
      return;
    }
    try{
      pyodide=await loadPyodide();
      pyodide.setStdout({batched:s=>appendOutput(s+'\\n',false)});
      pyodide.setStderr({batched:s=>appendOutput(s+'\\n',true)});
      statusEl.textContent='Ready'; statusDot.className='status-dot active';
      runBtn.disabled=false; saveBtn.disabled=false;
      refreshSavedList(); restoreSession();
    }catch(e){
      statusEl.textContent='Interpreter error'; statusDot.className='status-dot error';
      diagEl.textContent='Could not start Python: '+e.message;
    }
  }

  function restoreSession(){
    const lastActive=localStorage.getItem(LAST_ACTIVE_FILE_KEY), lastDraft=localStorage.getItem(DRAFT_KEY);
    if(lastActive && localStorage.getItem(lastActive)!==null) loadFile(lastActive);
    else if(lastDraft!==null){ codeEl.value=lastDraft; updateHeaderDisplay(null); }
  }

  function updateHeaderDisplay(fileName){
    if(fileName){ currentFileNameEl.textContent=`File: ${fileName}`; deleteBtn.disabled=false; }
    else { currentFileNameEl.textContent='Untitled (Unsaved Draft)'; deleteBtn.disabled=true; }
  }

  codeEl.addEventListener('input',()=>localStorage.setItem(DRAFT_KEY,codeEl.value));

  async function runCode(){
    if(!pyodide)return;
    runBtn.disabled=true; statusEl.textContent='Executing…'; outputEl.textContent='';
    try{ await pyodide.runPythonAsync(codeEl.value); statusEl.textContent='Ready'; }
    catch(e){ appendOutput(String(e.message||e)+'\\n',true); statusEl.textContent='Execution error'; }
    finally{ runBtn.disabled=false; }
  }

  function refreshSavedList(){
    loadSelect.innerHTML='<option value="">Open Saved File…</option>';
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key&&key.startsWith(STORAGE_PREFIX)){
        const name=key.slice(STORAGE_PREFIX.length), opt=document.createElement('option');
        opt.value=key; opt.textContent=name; if(key===activeFileKey)opt.selected=true;
        loadSelect.appendChild(opt);
      }
    }
  }

  function loadFile(key){
    const value=localStorage.getItem(key);
    if(value!==null){
      codeEl.value=value; activeFileKey=key;
      const fileName=key.slice(STORAGE_PREFIX.length);
      updateHeaderDisplay(fileName);
      localStorage.setItem(LAST_ACTIVE_FILE_KEY,key);
      localStorage.setItem(DRAFT_KEY,value); refreshSavedList();
    }
  }

  newBtn.addEventListener('click',()=>{
    codeEl.value='print("New script")'; activeFileKey=null;
    localStorage.removeItem(LAST_ACTIVE_FILE_KEY); localStorage.setItem(DRAFT_KEY,codeEl.value);
    updateHeaderDisplay(null); loadSelect.value='';
  });

  deleteBtn.addEventListener('click',()=>{
    if(!activeFileKey)return;
    const fileName=activeFileKey.slice(STORAGE_PREFIX.length);
    if(confirm(`Are you sure you want to delete "${fileName}"?`)){
      localStorage.removeItem(activeFileKey); localStorage.removeItem(LAST_ACTIVE_FILE_KEY);
      activeFileKey=null; codeEl.value=''; localStorage.setItem(DRAFT_KEY,'');
      updateHeaderDisplay(null); refreshSavedList();
    }
  });

  runBtn.addEventListener('click',runCode);
  clearBtn.addEventListener('click',()=>outputEl.textContent='');

  saveBtn.addEventListener('click',()=>{
    saveRow.style.display='flex';
    if(activeFileKey)saveName.value=activeFileKey.slice(STORAGE_PREFIX.length);
    saveName.focus();
  });

  cancelSaveBtn.addEventListener('click',()=>{
    saveRow.style.display='none'; saveName.value='';
  });

  confirmSaveBtn.addEventListener('click',()=>{
    const name=saveName.value.trim();
    if(!name){ appendOutput('Please specify a filename before saving.\\n',true); return; }
    try{
      const targetKey=STORAGE_PREFIX+name;
      localStorage.setItem(targetKey,codeEl.value); activeFileKey=targetKey;
      localStorage.setItem(LAST_ACTIVE_FILE_KEY,activeFileKey);
      saveRow.style.display='none'; saveName.value='';
      updateHeaderDisplay(name); refreshSavedList();
    }catch(e){ appendOutput('Could not save file: '+e.message+'\\n',true); }
  });

  loadSelect.addEventListener('change',()=>{ const key=loadSelect.value; if(key)loadFile(key); });
  boot();
})();
</script>
</body>
</html>
